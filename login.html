<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Veterinaria La Mary</title>
    <script src="assets/scripts/tema.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/main.css">
    <link rel="stylesheet" href="assets/styles/login.css">
    <link rel="icon" type="image/png" href="assets/img/icon.png">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand logo d-flex align-items-center" href="index.html">
                    <img src="assets/img/icon.png" alt="Logo de Veterinaria La Mary" class="logo-icono me-2">
                    Veterinaria La Mary
                </a>
                <a class="nav-link" href="index.html">Volver al inicio</a>
            </div>
        </nav>
    </header>

    <main class="container my-5">

        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <section class="card shadow-sm p-4">

                    <h1 class="text-center mb-4">Iniciar sesión</h1>

                    <form id="formLogin">

                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="usuario"
                                placeholder="Ingresá tu usuario" required>
                        </div>

                        <div class="mb-3">
                            <label for="contrasenia" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="contrasenia"
                                placeholder="Ingresá tu contraseña" required>
                        </div>

                        <div id="mensajeError" class="alert alert-danger d-none" role="alert">
                            Usuario o contraseña incorrectos.
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary" id="btnIngresar">
                                Ingresar
                            </button>
                        </div>

                    </form>

                </section>

            </div>
        </div>

    </main>

    <footer class="text-center py-4">
        <p>Veterinaria La Mary | © 2026. Todos los derechos reservados.</p>
        <p>Dirección: Av. Principal 123 | Teléfono: 0343 - 1234567</p>
    </footer>

    <script src="assets/scripts/login.js"></script>

</body>

</html>
